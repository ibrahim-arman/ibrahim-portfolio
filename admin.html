<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Portfolio Admin</title>
<style>
  :root {
    --bg: #f6f7f9; --surface: #ffffff; --text: #1b1f24; --muted: #5d6673;
    --line: #d9dde3; --accent: #1f5eff; --danger: #c62828;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14171c; --surface: #1c2027; --text: #e8eaed; --muted: #9aa3af; --line: #2e343d; --accent: #6b95ff; --danger: #ef6b6b; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--text); }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 1.5rem; margin: 0 0 16px; }
  h2 { font-size: 1.1rem; margin: 0 0 12px; }
  section { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; margin-bottom: 20px; }
  label { display: block; font-size: .9rem; color: var(--muted); margin: 12px 0 4px; }
  input, textarea { width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--text); font: inherit; }
  textarea { min-height: 90px; resize: vertical; }
  button { margin-top: 14px; padding: 9px 16px; border: 0; border-radius: 6px; background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
  button.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
  button.danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); margin-top: 0; padding: 4px 10px; }
  button:disabled { opacity: .55; cursor: wait; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
  .row:first-of-type { border-top: 0; }
  .row small { color: var(--muted); display: block; }
  .msg { padding: 10px 0; border-top: 1px solid var(--line); }
  .msg:first-of-type { border-top: 0; }
  .msg p { margin: 4px 0 0; white-space: pre-wrap; }
  .status { min-height: 1.4em; color: var(--muted); font-size: .9rem; margin: 8px 0 0; }
  .top { display: flex; justify-content: space-between; align-items: center; }
  .top button { margin: 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div class="top">
    <h1>Portfolio admin</h1>
    <button id="logout" class="ghost" hidden>Sign out</button>
  </div>

  <!-- Sign in -->
  <section id="login-box">
    <h2>Sign in</h2>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username">
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password">
    <button id="login">Sign in</button>
    <p class="status" id="login-status"></p>
  </section>

  <!-- Signed-in area -->
  <div id="app" hidden>
    <section>
      <h2>Add a project</h2>
      <label for="title">Title</label>
      <input id="title" maxlength="80">
      <label for="description">Description</label>
      <textarea id="description" maxlength="500"></textarea>
      <label for="tech">Technologies (comma separated)</label>
      <input id="tech" placeholder="Python, JavaScript, HTML">
      <label for="github">GitHub link</label>
      <input id="github" type="url" placeholder="https://github.com/ibrahim-arman/...">
      <label for="live">Live demo link (optional)</label>
      <input id="live" type="url" placeholder="https://...">
      <label for="image">Screenshot</label>
      <input id="image" type="file" accept="image/*">
      <button id="save">Save project</button>
      <p class="status" id="save-status"></p>
    </section>

    <section>
      <h2>Your projects</h2>
      <div id="project-list"></div>
    </section>

    <section>
      <h2>Messages</h2>
      <div id="message-list"></div>
    </section>
  </div>
</main>

<script type="module">
import { db, auth } from "./firebase.js";
import { uploadImage } from "./cloudinary.js";
import { signInWithEmailAndPassword, signOut, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { ref, push, get, remove, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
};

/* ---- Auth ---- */
$("login").onclick = async () => {
  $("login-status").textContent = "Signing in...";
  try {
    await signInWithEmailAndPassword(auth, $("email").value.trim(), $("password").value);
    $("login-status").textContent = "";
  } catch {
    $("login-status").textContent = "Wrong email or password.";
  }
};
$("logout").onclick = () => signOut(auth);

onAuthStateChanged(auth, (user) => {
  const signedIn = !!user;
  $("login-box").hidden = signedIn;
  $("app").hidden = !signedIn;
  $("logout").hidden = !signedIn;
  if (signedIn) { loadProjects(); loadMessages(); }
});

/* ---- Save a project ---- */
$("save").onclick = async () => {
  const status = $("save-status");
  const title = $("title").value.trim();
  const description = $("description").value.trim();
  if (!title || !description) { status.textContent = "Title and description are required."; return; }

  $("save").disabled = true;
  try {
    let image = "";
    const file = $("image").files[0];
    if (file) { status.textContent = "Uploading image..."; image = await uploadImage(file); }

    status.textContent = "Saving project...";
    await push(ref(db, "projects"), {
      title, description, image,
      tech: $("tech").value.split(",").map((t) => t.trim()).filter(Boolean),
      github: $("github").value.trim(),
      live: $("live").value.trim(),
      createdAt: serverTimestamp(),
    });

    ["title", "description", "tech", "github", "live", "image"].forEach((id) => ($(id).value = ""));
    status.textContent = "Project saved.";
    loadProjects();
  } catch (err) {
    console.error(err);
    status.textContent = "Could not save: " + err.message;
  } finally {
    $("save").disabled = false;
  }
};

/* ---- Lists ---- */
async function loadProjects() {
  const box = $("project-list");
  box.replaceChildren();
  const snap = await get(ref(db, "projects"));
  if (!snap.exists()) { box.append(el("p", "", "No projects yet. Add your first one above.")); return; }

  Object.entries(snap.val()).forEach(([id, p]) => {
    const row = el("div", "row");
    const info = el("div");
    info.append(el("strong", "", p.title), el("small", "", (p.tech || []).join(", ")));
    const del = el("button", "danger", "Delete");
    del.onclick = async () => {
      if (!confirm(`Delete "${p.title}"?`)) return;
      await remove(ref(db, "projects/" + id));
      loadProjects();
    };
    row.append(info, del);
    box.append(row);
  });
}

async function loadMessages() {
  const box = $("message-list");
  box.replaceChildren();
  const snap = await get(ref(db, "messages"));
  if (!snap.exists()) { box.append(el("p", "", "No messages yet.")); return; }

  Object.entries(snap.val())
    .sort(([, a], [, b]) => (b.createdAt || 0) - (a.createdAt || 0))
    .forEach(([id, m]) => {
      const item = el("div", "msg");
      const when = m.createdAt ? new Date(m.createdAt).toLocaleString() : "";
      item.append(
        el("strong", "", m.subject),
        el("small", "", `${m.name} (${m.email}) ${when}`),
        el("p", "", m.message)
      );
      const del = el("button", "danger", "Delete");
      del.style.marginTop = "6px";
      del.onclick = async () => { await remove(ref(db, "messages/" + id)); loadMessages(); };
      item.append(del);
      box.append(item);
    });
}
</script>
</body>
</html>
